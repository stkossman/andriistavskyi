  <!-- tick 7 --> <line x1="520" y1="43" x2="520" y2="77" style="fill:none;stroke:rgb(250, 249, 245);color:rgb(251, 251, 254);stroke-width:4.5px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:15px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
