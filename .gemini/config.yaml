$schema: "http://json-schema.org/draft-07/schema#"
have_fun: false
memory_config:
  disabled: false
code_review:
  disable: false
  comment_severity_threshold: HIGH
  max_review_comments: -1
  pull_request_opened:
    help: false
    summary: true
    code_review: true
    include_drafts: true
ignore_patterns: 
  - "dist/*"
  - "node_modules/*"
  - ".astro/*"